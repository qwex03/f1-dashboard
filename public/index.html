<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0B0E" />
    <meta name="description" content="Apex F1 — classements, résultats, calendrier et actualités de la Formule 1" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script>
      // Apply the saved theme before first paint (dark by default) to avoid a flash
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>Apex F1</title>
  </head>
  <body>
    <noscript>Activez JavaScript pour utiliser Apex F1.</noscript>
    <div id="root"></div>
  </body>
</html>
